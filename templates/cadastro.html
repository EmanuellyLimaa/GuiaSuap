<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Cadastro </title>

    <link rel="stylesheet" href="{% load static 'css/style.css' %}">
</head>

<body>

    <main class="paginas-cadastro">
        <section class="cadastro-container">
            <div class="logo">
                <h1> Guia <span> Suap </span></h1>
                <p> Desbravando o SUAP sem mistérios </p>
            </div>
            <h2> Crie sua conta </h2>
            <p class="descricao"> Cadastre´se para acessa o GuiaSuap. </p>

            <form method="post">
                {% csrf_token %}

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                </div>

                   <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                </div>

                   <div class="campo">
                    <label for="confirmar_senha">Confirmar senha</label>
                    <input
                        type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Confirme sua senha" required>
                </div>

                <button type="submit"> Cadastrar </button>

            </form>

            <p class="login-link"> Já possui um cadastro? <a href="{% url 'login'%}"> Entrar </a></p>
        </section>
    </main>

</body>

</html>
