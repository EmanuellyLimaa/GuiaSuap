{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir tutorial - GuiaSuap</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="paginas-cadastro">
    <main class="cadastro-container">
        <div class="logo">
            <h1>Guia<span>Suap</span></h1>
        </div>

        <h2>Excluir tutorial</h2>
        <p style="margin: 20px 0;">
            Tem certeza de que deseja excluir
            <strong>{{ tutorial.titulo }}</strong>?
        </p>

        <form method="post">
            {% csrf_token %}
            <button type="submit">Sim, excluir tutorial</button>
        </form>

        <p class="login-link">
            <a href="{% url 'gerenciar_tutoriais' %}">
                Cancelar e voltar
            </a>
        </p>
    </main>
</body>
</html>
